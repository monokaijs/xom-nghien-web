name: Launcher Beta Release

on:
  push:
    tags: ["launcher-v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: macos-14
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - run: pnpm install --frozen-lockfile
      - run: dotnet build packages/valheim-launcher-bridge/XomNghien.ValheimBridge.csproj -c Release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/launcher
          tagName: ${{ github.ref_name }}
          releaseName: "Xom Nghien Launcher ${{ github.ref_name }}"
          releaseBody: "Unsigned Valheim launcher beta. Windows SmartScreen and macOS Gatekeeper may display a warning. See apps/launcher/README.md for installation notes."
          releaseDraft: false
          prerelease: false
          args: >-
            ${{ matrix.args }} --config '{"plugins":{"updater":{"pubkey":"${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}","endpoints":["https://github.com/monokaijs/xom-nghien-web/releases/latest/download/latest.json"]}}}'

  checksums:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir artifacts
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          gh release upload "${GITHUB_REF_NAME}" artifacts/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
