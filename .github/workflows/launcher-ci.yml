name: Launcher CI

on:
  pull_request:
    paths:
      - "apps/launcher/**"
      - "packages/valheim-launcher-bridge/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/launcher-*.yml"
  push:
    branches: [main]
    paths:
      - "apps/launcher/**"
      - "packages/valheim-launcher-bridge/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/launcher-*.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xom/launcher typecheck
      - run: pnpm --filter @xom/launcher test
      - run: dotnet test packages/valheim-launcher-bridge/tests/XomNghien.ValheimBridge.Tests.csproj -c Release
      - run: cargo fmt --manifest-path apps/launcher/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/launcher/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/launcher/src-tauri/Cargo.toml
